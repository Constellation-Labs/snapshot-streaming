snapshotStreaming {
  lastSnapshotPath = "lastSnapshot.json"
  lastIncrementalSnapshotPath = "lastIncrementalSnapshot.json"
  environment = Dev
  collateral = 0
  httpClient {
    timeout = "120s"
    idleTimeInPool = "30s"
  }
  node {
    l0Peers = ["""{"id": "<id>", "ip": "<ip>", "port": "<port>"}"""]
    pullInterval = "5s"
    pullLimit = 4
    # terminalSnapshotOrdinal = 30
  }
  opensearch {
    host = "http://sample"
    port = "80"
    bulkSize = "10000"
    indexes {
      snapshots = "snapshots"
      blocks = "blocks"
      transactions = "transactions"
      balances = "balances"
      currency {
        snapshots = "currency-snapshots"
        blocks = "currency-blocks"
        transactions = "currency-transactions"
        balances = "currency-balances"
      }
    }
  }
  s3 {
    bucketRegion = ""
    bucketName = ""
    bucketDir = ""
  }
}

state-after-joining = Ready
