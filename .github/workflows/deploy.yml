on:
  push:
    branches:
      - release/testnet
      - release/integrationnet
      - release/mainnet

name: Build and Deploy

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Clone and build Tessellation (testnet only)
        if: github.ref_name == 'release/testnet'
        run: |
          git clone https://github.com/Constellation-Labs/tessellation.git
          cd tessellation
          git checkout release/testnet

      - name: Setup Java 21 for Tessellation (testnet only)
        if: github.ref_name == 'release/testnet'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build Tessellation (testnet only)
        if: github.ref_name == 'release/testnet'
        run: |
          cd tessellation
          sbt clean publishM2

      - name: Get Tessellation version and update Dependencies.scala (testnet only)
        if: github.ref_name == 'release/testnet'
        run: |
          # Extract version from tessellation's version.sbt
          TESSELLATION_VERSION=$(cd tessellation && sbt -no-colors "print version" | tail -1 | tr -d '[:space:]')
          echo "Tessellation version: $TESSELLATION_VERSION"
          
          # Update Dependencies.scala with the new tessellation version
          sed -i "s/val tessellation = \".*\"/val tessellation = \"$TESSELLATION_VERSION\"/" project/Dependencies.scala
          
          # Verify the change
          echo "Updated Dependencies.scala:"
          grep "val tessellation" project/Dependencies.scala

      - name: Setup Java and scala
        with:
          JAVA_VERSION: 11
        uses: "./.github/templates/actions/setup_java_and_scala"

      - name: Assembly 🚀
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: sbt clean assembly

      - name: Copy dependencies
        run: |
          # Find the assembled JAR (version-agnostic)
          cp ./target/scala-2.13/*-assembly-*.jar ./snapshot-streaming.jar

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: jar-files
          path: |
            ./snapshot-streaming.jar

  deploy-testnet:
    if: github.ref_name == 'release/testnet'
    name: Deploy testnet
    runs-on: ubuntu-latest
    needs: build
    environment: TESTNET
    steps:
      - uses: actions/checkout@v4

      - name: Deploy Testnet
        uses: "./.github/templates/actions/deploy"
        with:
          SSH_NODE_HOST: ${{ secrets.SSH_NODE_HOST }}
          SSH_NODE_USER: ${{ secrets.SSH_NODE_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}

  deploy-integrationnet:
    if: github.ref_name == 'release/integrationnet'
    name: Deploy integrationnet
    runs-on: ubuntu-latest
    needs: build
    environment: INTEGRATIONNET
    steps:
      - uses: actions/checkout@v4

      - name: Deploy Integrationnet
        uses: "./.github/templates/actions/deploy"
        with:
          SSH_NODE_HOST: ${{ secrets.SSH_NODE_HOST }}
          SSH_NODE_USER: ${{ secrets.SSH_NODE_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}

  deploy-mainnet:
    if: github.ref_name == 'release/mainnet'
    name: Deploy mainnet
    runs-on: ubuntu-latest
    needs: build
    environment: MAINNET
    steps:
      - uses: actions/checkout@v4

      - name: Deploy Mainnet
        uses: "./.github/templates/actions/deploy"
        with:
          SSH_NODE_HOST: ${{ secrets.SSH_NODE_HOST }}
          SSH_NODE_USER: ${{ secrets.SSH_NODE_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}